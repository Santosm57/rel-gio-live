<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0);
  overflow: hidden;
}
#clock {
  color: white;
  font-family: Arial, sans-serif;
  font-size: 64px;
  font-weight: bold;
  text-align: center;
  text-shadow: 2px 2px 5px #000;
}
</style>
</head>
<body>
<div id="clock">--:--</div>
<script>
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("pt-PT", {
      timeZone: "Europe/Lisbon",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).format(now);
}
updateClock();
setInterval(updateClock, 10000);
</script>
</body>
</html>
